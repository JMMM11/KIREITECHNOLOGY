<!doctype html>
<!-- Plantilla de la imagen para compartir (public/og-kirei.jpg). Se genera con: node scripts/og/generar.mjs
     Solo paleta Kirei: marino de fondo, blanco y niebla para el texto, naranja para el acento. Poppins. -->
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Poppins; font-weight: 400; src: url(../../public/fuentes/poppins-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: Poppins; font-weight: 600; src: url(../../public/fuentes/poppins-latin-600-normal.woff2) format('woff2'); }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; display: grid; grid-template-columns: 540px 1fr; background: #0B1F33; color: #FFFFFF; font-family: Poppins, sans-serif; }
  /* Halo marino medio detrás del mosaico: da profundidad sin salirse de la paleta */
  body::before { content: ''; position: absolute; right: -120px; top: -160px; width: 820px; height: 820px; border-radius: 50%; background: radial-gradient(closest-side, #16324F, transparent); }
  .texto { position: relative; display: flex; flex-direction: column; padding: 54px 30px 50px 62px; }
  .logo { width: 290px; height: auto; margin-left: -14px; }
  h1 { margin-top: auto; font-weight: 600; font-size: 54px; line-height: 1.04; letter-spacing: -0.035em; }
  h1 span { color: #F7931E; }
  p { margin-top: 16px; font-size: 21px; line-height: 1.4; color: #B7C4D3; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
  .chip { padding: 9px 17px; border-radius: 999px; font-size: 16px; font-weight: 600; color: #FFFFFF; box-shadow: inset 0 0 0 1.5px rgba(183, 196, 211, 0.5); }
  .chip.naranja { background: #F7931E; color: #111111; box-shadow: none; }
  /* Mosaico inclinado: fotos reales de la tienda, tecnología y perfumes mezclados */
  .mosaico { position: relative; }
  .rejilla { position: absolute; left: 10px; top: -70px; display: grid; grid-template-columns: repeat(3, 196px); gap: 14px; transform: rotate(-8deg); }
  .col { display: grid; gap: 14px; align-content: start; }
  .col:nth-child(2) { margin-top: -60px; }
  .col:nth-child(3) { margin-top: 30px; }
  .rejilla img { width: 196px; height: 236px; object-fit: cover; border-radius: 20px; display: block; box-shadow: 0 18px 40px rgba(7, 21, 36, 0.55); }
  .rejilla img.alta { height: 300px; }
  .sello { position: absolute; right: 36px; bottom: 34px; padding: 12px 20px; border-radius: 999px; background: #FFFFFF; color: #0B1F33; font-size: 17px; font-weight: 600; box-shadow: 0 14px 30px rgba(7, 21, 36, 0.5); }
  .sello b { color: #9A5200; }
</style>
</head>
<body>
  <section class="texto">
    <img class="logo" src="../../public/marca/kirei-logo-fondo-oscuro.svg" alt="">
    <h1>Tecnología, perfumes <span>y reparaciones.</span></h1>
    <p>Lenovo, LIGE, Lattafa, Ariana Grande, Armaf y más. Envíos en todo Panamá.</p>
    <div class="chips">
      <span class="chip naranja">Paga con Yappy</span><span class="chip">Retiro gratis</span><span class="chip">Garantía</span>
    </div>
  </section>
  <section class="mosaico">
    <div class="rejilla">
      <div class="col">
        <img class="alta" src="../../Productos/Lenovo GM2 Pro (7).jpg" alt="">
        <img src="../../perfumes/42.png" alt="">
        <img src="../../perfumes/62.png" alt="">
      </div>
      <div class="col">
        <img src="../../perfumes/36.png" alt="">
        <img class="alta" src="../../Productos/Razer Pikachu (4).jpg" alt="">
        <img src="../../perfumes/54.png" alt="">
      </div>
      <div class="col">
        <img src="../../perfumes/46.png" alt="">
        <img class="alta" src="../../reparaciones/placa-base.png" alt="">
        <img src="../../perfumes/39.png" alt="">
      </div>
    </div>
    <span class="sello">29 perfumes <b>nuevos</b></span>
  </section>
</body>
</html>
