<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Finalizar pedido | Kirei Technology</title>
  <meta name="theme-color" content="#F7F5F1">
  <link rel="icon" href="assets/logo/kirei-icono-naranja.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <script>document.documentElement.classList.add('js');</script>
</head>
<body data-pagina="checkout">
  <a class="skip" href="#main">Saltar al contenido</a>
  <header class="site-header" id="cabecera"></header>

  <main id="main" class="container">
    <h1 class="display" style="padding-top:40px">Finaliza tu pedido.</h1>

    <div id="checkout-vacio" class="empty" hidden>
      <p>Tu carrito está vacío.</p>
      <a class="link" href="index.html#tienda">Ver la tienda</a>
    </div>

    <div id="checkout" class="checkout">
      <form id="form-pedido" class="panel form" novalidate>
        <h2 class="title">Tus datos</h2>
        <div class="field">
          <label for="nombre">Nombre</label>
          <input class="input" id="nombre" name="nombre" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="telefono">Teléfono</label>
          <input class="input" id="telefono" name="telefono" type="tel" autocomplete="tel" inputmode="tel" placeholder="6000 0000" required>
        </div>
        <div class="field">
          <label for="correo">Correo <span class="muted">(opcional)</span></label>
          <input class="input" id="correo" name="correo" type="email" autocomplete="email">
        </div>

        <fieldset class="choices">
          <legend class="legend">Entrega</legend>
          <label class="choice"><input type="radio" name="entrega" value="retiro" checked><span class="choice__title">Retiro</span><span class="choice__hint">Gratis. Coordinamos el lugar y la hora por WhatsApp.</span></label>
          <label class="choice"><input type="radio" name="entrega" value="punto"><span class="choice__title">Punto de encuentro</span><span class="choice__hint">Costo: <span data-tarifa="envioPuntoEncuentro"></span>. Lo coordinamos por WhatsApp.</span></label>
          <label class="choice"><input type="radio" name="entrega" value="domicilio"><span class="choice__title">Envío a domicilio</span><span class="choice__hint"><span data-tarifa="envioDomicilio"></span> dentro de Panamá.</span></label>
        </fieldset>

        <div class="field" id="campo-direccion" hidden>
          <label for="direccion">Dirección de entrega</label>
          <textarea class="input" id="direccion" name="direccion" autocomplete="street-address" placeholder="Provincia, corregimiento, calle y referencia"></textarea>
        </div>

        <fieldset class="choices">
          <legend class="legend">Pago</legend>
          <label class="choice"><input type="radio" name="pago" value="yappy" id="pago-yappy" checked><span class="choice__title">Yappy</span><span class="choice__hint">Te enviamos los datos de pago por WhatsApp.</span></label>
          <label class="choice"><input type="radio" name="pago" value="contra_entrega" id="pago-contra"><span class="choice__title">Contra entrega</span><span class="choice__hint" id="ayuda-contra"></span></label>
        </fieldset>

        <div class="field">
          <label for="nota">Nota <span class="muted">(opcional)</span></label>
          <textarea class="input" id="nota" name="nota" placeholder="Algo que debamos saber"></textarea>
        </div>

        <label class="check"><input type="checkbox" name="acepto" required><span>Acepto que Kirei Technology use mis datos solo para gestionar este pedido. Lee la <a href="legal.html#privacidad">política de privacidad</a>.</span></label>

        <button class="btn btn--primary btn--block" type="submit">Enviar pedido por WhatsApp</button>
        <p class="hint">No guardamos tus datos de pago.</p>

        <div class="notice" id="enviado" role="status" tabindex="-1" hidden>
          <p>Abrimos WhatsApp con tu pedido. Envía el mensaje y te confirmamos el total y el pago.</p>
          <button class="btn btn--ghost" type="button" id="vaciar" style="margin-top:12px">Vaciar carrito</button>
        </div>
      </form>

      <aside class="panel checkout__summary" aria-labelledby="resumen-titulo">
        <h2 class="title" id="resumen-titulo">Resumen</h2>
        <div id="resumen-lineas"></div>
        <div class="totals" id="resumen-totales" aria-live="polite"></div>
      </aside>
    </div>
  </main>

  <footer class="site-footer" id="pie"></footer>
  <script src="js/data.js"></script>
  <script src="js/totales.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
