  <style>
    @font-face { font-family: 'Poppins'; font-style: normal; font-weight: 300; font-display: swap; src: url('./fuentes/poppins-latin-300-normal.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
    @font-face { font-family: 'Poppins'; font-style: normal; font-weight: 400; font-display: swap; src: url('./fuentes/poppins-latin-400-normal.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

    /* Pantalla de arranque: se ve mientras carga la app y React la reemplaza al montar. */
    body { margin: 0; }
    .arranque { min-height: 100svh; display: grid; place-items: center; align-content: center; gap: 14px; background: #F7F5F1; }
    .arranque .o { stroke: #F7931E; animation: senal 1.2s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
    .arranque .o2 { animation-delay: 0.15s; } .arranque .o3 { animation-delay: 0.3s; }
    @keyframes senal { 0%, 100% { opacity: 0.15; } 40% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .arranque .o { animation: none; } }
  </style>
</head>
